name: My First CI Workflow

# 1. Choose what event triggers the workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Define the work to execute
jobs:
  build:
    # Runs on a fresh virtual machine managed by GitHub
    runs-on: ubuntu-latest

    steps:
      # Step 3: Check out your repository code onto the virtual machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 4: Run a simple command
      - name: Print a welcome message
        run: echo "Hello! My CI/CD pipeline is running successfully."

      - name: Check files in current workspace
        run: ls -la